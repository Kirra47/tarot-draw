<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="沉浸式塔罗抽卡体验：支持触摸、鼠标与摄像头手势，生成三至五张牌的个性化解读。">
<meta name="theme-color" content="#050510">
<title>塔罗抽卡 · Tarot Draw</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;min-height:100dvh;overscroll-behavior:none;background:#020208 url('./tarot-bg.png') center center/cover no-repeat fixed;font-family:'Segoe UI',system-ui,sans-serif;color:#c8d8f0;}
#c{display:block;width:100vw;height:100dvh;position:relative;z-index:1;touch-action:none;}
#camWrap{position:fixed;bottom:12px;left:12px;width:180px;height:135px;border-radius:10px;overflow:hidden;border:1px solid rgba(100,140,255,.3);z-index:20;display:none;box-shadow:0 4px 20px rgba(0,0,40,.5);}
#camWrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
#ui *{pointer-events:auto;}
#topBar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:linear-gradient(180deg,rgba(5,5,16,.85),transparent);}
#topBar h1{font-size:20px;letter-spacing:4px;color:#8ab4ff;text-shadow:0 0 15px rgba(100,160,255,.4);}
#deckCount{font-size:13px;color:#6a80a8;}
#gestureInfo{position:fixed;top:60px;left:22px;font-size:12px;color:#5a70a0;z-index:10;}
.uiBtn{background:rgba(15,20,40,.8);border:1px solid rgba(100,140,255,.25);color:#8ab4ff;padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .25s;backdrop-filter:blur(4px);}
.uiBtn:hover{background:rgba(30,50,100,.6);border-color:rgba(100,160,255,.5);box-shadow:0 0 12px rgba(80,130,255,.2);}
button:focus-visible,textarea:focus-visible{outline:2px solid #8ab4ff;outline-offset:3px;}
#modeBtn{position:fixed;top:12px;right:22px;z-index:30;}
#cardInfo{position:fixed;bottom:24px;right:24px;width:320px;max-height:55vh;background:rgba(8,12,30,.92);border:1px solid rgba(100,140,255,.2);border-radius:14px;padding:18px 20px;z-index:20;display:none;backdrop-filter:blur(10px);box-shadow:0 8px 40px rgba(0,0,40,.6);}
#cardInfo h2{font-size:22px;color:#8ab4ff;margin-bottom:8px;text-shadow:0 0 8px rgba(100,160,255,.3);}
#cardInfo .orient{font-size:17px;margin-bottom:10px;}
#cardInfo .meaning{font-size:16px;line-height:1.7;color:#9aadcc;}
#histPanel{position:fixed;top:56px;right:22px;width:270px;max-height:72vh;overflow-y:auto;background:rgba(8,12,30,.92);border:1px solid rgba(100,140,255,.2);border-radius:12px;z-index:20;display:none;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,40,.4);}
#histHeader{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(8,12,30,.97);border-bottom:1px solid rgba(100,140,255,.12);z-index:1;font-size:12px;color:#8ab4ff;}
#histClear{border:0;background:transparent;color:#64789e;cursor:pointer;font:inherit;}
#histClear:hover{color:#d08080;}
#histPanel::-webkit-scrollbar{width:4px;}
#histPanel::-webkit-scrollbar-thumb{background:rgba(100,140,255,.3);border-radius:2px;}
#histToggle{position:fixed;top:12px;right:155px;z-index:30;}
.histItem{padding:12px 16px;border-bottom:1px solid rgba(100,140,255,.1);font-size:12px;transition:background .2s;}
.histItem:hover{background:rgba(60,100,200,.08);}
.histItem .hname{color:#8ab4ff;font-weight:600;font-size:13px;}
#stateHint{position:fixed;top:18%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#8ab4ff;text-shadow:0 0 20px rgba(100,160,255,.5);z-index:15;opacity:0;transition:opacity .6s;pointer-events:none;letter-spacing:2px;}
#stateHint.show{opacity:1;}
#instrPanel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);text-align:center;font-size:13px;color:#4a6090;z-index:10;pointer-events:none;line-height:2;opacity:.7;}
#vCursor{position:fixed;z-index:25;pointer-events:none;display:none;transform:translate(-50%,-50%);}
#vCursorInner{width:36px;height:36px;border-radius:50%;border:2.5px solid rgba(100,180,255,.7);background:rgba(60,130,255,.15);box-shadow:0 0 18px rgba(80,160,255,.5),inset 0 0 8px rgba(100,180,255,.2);transition:all .2s;}
#vCursor.hover #vCursorInner{border-color:rgba(100,255,180,.9);background:rgba(60,255,150,.25);box-shadow:0 0 24px rgba(80,255,160,.6),inset 0 0 10px rgba(100,255,180,.3);transform:scale(1.3);}
#vCursor.grab #vCursorInner{border-color:rgba(255,180,60,.9);background:rgba(255,160,40,.35);box-shadow:0 0 24px rgba(255,180,60,.7),inset 0 0 10px rgba(255,180,60,.3);transform:scale(0.7);}
#vCursorLabel{position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:rgba(140,180,255,.8);text-shadow:0 0 6px rgba(80,140,255,.5);}
/* ── Settlement UI ── */
#settleBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;font-size:15px;padding:10px 28px;background:rgba(80,50,20,.85);border-color:rgba(255,180,60,.4);color:#ffd080;box-shadow:0 0 20px rgba(255,160,40,.2);animation:settlePulse 2s ease-in-out infinite;}
@keyframes settlePulse{0%,100%{box-shadow:0 0 20px rgba(255,160,40,.2);}50%{box-shadow:0 0 30px rgba(255,160,40,.5);}}
#drawCount{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);z-index:20;font-size:12px;color:#8a90b0;text-align:center;}
#settleOverlay{position:fixed;inset:0;z-index:100;background:rgba(2,2,8,.92);backdrop-filter:blur(12px);display:none;overflow-y:auto;padding:20px;}
#settleOverlay.show{display:flex;justify-content:center;align-items:flex-start;}
#settlePanel{max-width:720px;width:100%;padding:30px 24px;margin:20px auto;}
#settlePanel h2{text-align:center;font-size:24px;color:#8ab4ff;margin-bottom:24px;letter-spacing:4px;text-shadow:0 0 15px rgba(100,160,255,.4);}
#settleCards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:24px;}
.settleCard{width:200px;background:rgba(10,15,30,.85);border:1px solid rgba(100,140,255,.2);border-radius:12px;padding:14px;text-align:center;transition:all .3s;}
.settleCard:hover{border-color:rgba(100,160,255,.5);box-shadow:0 0 20px rgba(80,130,255,.2);transform:translateY(-4px);}
.settleCard .scNum{font-size:11px;color:#5a6a8a;margin-bottom:6px;}
.settleCard .scName{font-size:16px;color:#8ab4ff;font-weight:600;margin-bottom:4px;}
.settleCard .scOrient{font-size:13px;margin-bottom:8px;}
.settleCard .scMeaning{font-size:13px;color:#9aadcc;line-height:1.6;}
.settleCard .scElem{font-size:12px;color:#6a80a8;margin-top:6px;}
#settleSummary{background:rgba(15,20,40,.6);border:1px solid rgba(100,140,255,.15);border-radius:12px;padding:18px 20px;margin-bottom:20px;font-size:14px;color:#9aadcc;line-height:1.8;}
#settleClose{display:block;margin:0 auto;font-size:15px;padding:10px 32px;}
#readingActions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px;}
#readingActions #settleClose{margin:0;}
#copyReadingBtn.copied{color:#70d0a0;border-color:rgba(80,220,150,.45);}
#readingDisclaimer{text-align:center;margin:16px auto 0;max-width:560px;color:#566580;font-size:11px;line-height:1.6;}
/* ── Mobile responsive ── */
@media(max-width:768px){
  #cardInfo{left:8px;right:8px;bottom:8px;width:auto;max-height:38vh;padding:14px 16px;border-radius:12px;overflow-y:auto;}
  #cardInfo h2{font-size:18px;margin-bottom:4px;}
  #cardInfo .orient{font-size:14px;margin-bottom:6px;}
  #cardInfo .meaning{font-size:13px;line-height:1.6;}
  #camWrap{width:100px;height:75px;bottom:8px;left:8px;}
  #cardInfo~#camWrap,#camWrap{display:none!important;}
  #topBar{padding:10px 14px;}
  #topBar h1{font-size:16px;letter-spacing:2px;}
  .uiBtn{font-size:11px;padding:5px 10px;}
  #histToggle{right:auto;left:50%;transform:translateX(calc(-50% - 60px));top:8px;}
  #modeBtn{top:8px;right:14px;}
  #histPanel{right:8px;left:8px;width:auto;top:50px;max-height:60vh;}
  #stateHint{font-size:17px;top:14%;}
  #instrPanel{font-size:11px;bottom:12px;}
  #gestureInfo{font-size:11px;top:50px;left:14px;}
  #settleBtn{font-size:13px;padding:8px 20px;bottom:16px;}
  #drawCount{bottom:56px;}
  #settlePanel{padding:16px 12px;}
  #settlePanel h2{font-size:18px;margin-bottom:16px;}
  .settleCard{width:100%;max-width:320px;}
  #settleSummary{font-size:13px;padding:14px;}
}
/* ── Question Input Overlay ── */
#questionOverlay{position:fixed;inset:0;z-index:200;background:rgba(2,2,8,.95);display:flex;justify-content:center;align-items:center;transition:opacity .8s ease;}
#questionOverlay.hidden{opacity:0;pointer-events:none;}
.qCard{width:500px;max-width:90vw;padding:48px 40px;background:rgba(8,12,30,.95);border:1px solid rgba(100,140,255,.3);border-radius:16px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,40,.6);}
.qCard h2{font-size:24px;letter-spacing:6px;margin-bottom:8px;color:#8ab4ff;text-shadow:0 0 15px rgba(100,160,255,.4);}
.qCard .qSub{font-size:13px;color:#6a80a8;margin-bottom:28px;letter-spacing:1px;}
#questionInput{width:100%;min-height:100px;padding:16px;border-radius:10px;border:1px solid rgba(100,140,255,.25);background:rgba(2,2,8,.8);color:#c8d8f0;font-size:16px;font-family:inherit;resize:none;outline:none;transition:border-color .3s;}
#questionInput:focus{border-color:rgba(100,160,255,.6);}
#questionInput::placeholder{color:#4a5878;font-style:italic;}
#questionConfirm{margin-top:24px;padding:12px 44px;border:1px solid rgba(100,140,255,.35);border-radius:10px;background:rgba(20,30,60,.8);color:#8ab4ff;font-size:15px;letter-spacing:3px;cursor:pointer;transition:all .3s;font-family:inherit;}
#questionConfirm:hover{background:rgba(30,50,100,.7);border-color:rgba(100,160,255,.6);box-shadow:0 0 20px rgba(80,130,255,.2);}
.qHint{margin-top:14px;color:#4f6080;font-size:11px;line-height:1.6;}
/* ── AI Streaming Reading ── */
#aiReading{margin-top:20px;min-height:40px;}
#aiContent{font-size:14px;line-height:1.9;color:#9aadcc;}
#aiContent h3{color:#8ab4ff;font-size:17px;margin:18px 0 8px 0;letter-spacing:2px;}
#aiContent strong{color:#8ab4ff;}
#aiCursor{display:inline-block;width:2px;height:16px;background:#8ab4ff;margin-left:2px;vertical-align:text-bottom;animation:cBlink .8s infinite;}
@keyframes cBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
.aiThinking{display:flex;align-items:center;gap:12px;padding:16px 0;color:#6a80a8;font-size:13px;letter-spacing:2px;}
.aiThinking .dots span{display:inline-block;width:6px;height:6px;background:#8ab4ff;border-radius:50%;margin:0 2px;animation:dPulse 1.4s infinite ease-in-out;}
.aiThinking .dots span:nth-child(2){animation-delay:.2s;}
.aiThinking .dots span:nth-child(3){animation-delay:.4s;}
@keyframes dPulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}
#aiProgressBar{width:100%;height:3px;background:rgba(100,140,255,.1);border-radius:2px;margin-top:12px;overflow:hidden;}
#aiProgressFill{height:100%;width:0%;background:linear-gradient(90deg,rgba(100,140,255,.6),rgba(100,180,255,.9));transition:width .3s;border-radius:2px;}
#aiRetryBtn{margin-top:16px;padding:8px 24px;border:1px solid rgba(100,140,255,.25);border-radius:8px;background:transparent;color:#6a80a8;cursor:pointer;font-size:12px;letter-spacing:2px;transition:all .3s;font-family:inherit;display:none;}
#aiRetryBtn:hover{border-color:rgba(100,160,255,.5);color:#8ab4ff;}
/* ── AI Reading active state ── */
#aiReading.active{border:1px solid rgba(100,140,255,.15);border-radius:12px;padding:16px;animation:readingGlow 3s ease-in-out infinite;}
@keyframes readingGlow{
  0%,100%{box-shadow:0 0 8px rgba(100,140,255,.08);border-color:rgba(100,140,255,.12);}
  50%{box-shadow:0 0 24px rgba(100,160,255,.18);border-color:rgba(100,160,255,.3);}
}
#aiReadingHeader{display:none;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(100,140,255,.1);}
#aiReadingHeader.show{display:flex;}
#aiReadingHeader .readingLabel{font-size:13px;color:#8ab4ff;letter-spacing:3px;animation:labelPulse 2.5s ease-in-out infinite;}
@keyframes labelPulse{0%,100%{opacity:.6;}50%{opacity:1;}}
.readingOrb{width:22px;height:22px;border-radius:50%;position:relative;}
.readingOrb::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(100,160,255,.5),transparent 70%);animation:orbPulse 2s ease-in-out infinite;}
.readingOrb::after{content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(140,190,255,.8),rgba(80,130,255,.3) 60%,transparent);animation:orbInner 1.5s ease-in-out infinite alternate;}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.3);opacity:1;}}
@keyframes orbInner{0%{transform:scale(.8);}100%{transform:scale(1.1);}}
.readingDots{display:flex;gap:4px;align-items:center;}
.readingDots span{width:4px;height:4px;background:#8ab4ff;border-radius:50%;animation:dotBounce 1.4s ease-in-out infinite;}
.readingDots span:nth-child(2){animation-delay:.15s;}
.readingDots span:nth-child(3){animation-delay:.3s;}
.readingDots span:nth-child(4){animation-delay:.45s;}
.readingDots span:nth-child(5){animation-delay:.6s;}
@keyframes dotBounce{0%,80%,100%{opacity:.2;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topBar">
    <h1>✦ TAROT ✦</h1>
    <span id="deckCount">剩余: 78</span>
  </div>
</div>
<div id="gestureInfo">模式: 鼠标</div>
<button id="modeBtn" class="uiBtn" aria-label="切换鼠标或摄像头手势模式">切换手势模式</button>
<button id="histToggle" class="uiBtn" aria-controls="histPanel" aria-expanded="false">历史记录</button>
<div id="histPanel" aria-label="抽牌历史"><div id="histHeader"><span>抽牌历史</span><button id="histClear">清空</button></div><div id="histItems"><div id="histEmpty" style="padding:20px;text-align:center;color:#4a5878;font-size:13px;">暂无抽牌记录</div></div></div>
<div id="cardInfo">
  <h2 id="ciName"></h2>
  <div class="orient" id="ciOrient"></div>
  <div class="meaning" id="ciMeaning"></div>
</div>
<div id="camWrap"><video id="camVid" autoplay playsinline></video></div>
<div id="stateHint"></div>
<div id="vCursor"><div id="vCursorInner"></div><div id="vCursorLabel"></div></div>
<div id="instrPanel"></div>
<!-- Question Input Overlay -->
<div id="questionOverlay" role="dialog" aria-modal="true" aria-labelledby="questionTitle">
  <div class="qCard">
    <h2 id="questionTitle">心中所想</h2>
    <p class="qSub">请在心中默念你的问题，然后写下来</p>
    <textarea id="questionInput" maxlength="240" placeholder="写下你心中所想的事情...&#10;例如：我的感情方向如何？近期的事业该怎么选择？" rows="4"></textarea>
    <button id="questionConfirm">开始占卜</button>
    <p class="qHint">可以留空进行综合解读。塔罗用于自我探索与娱乐，不替代医疗、法律或财务建议。</p>
  </div>
</div>
<button id="settleBtn" class="uiBtn" style="display:none;">✦ 结算解读</button>
<div id="drawCount" style="display:none;"></div>
<div id="settleOverlay" role="dialog" aria-modal="true" aria-labelledby="settleTitle">
  <div id="settlePanel">
    <h2 id="settleTitle">✦ 塔罗解读总结 ✦</h2>
    <div id="settleCards"></div>
    <div id="settleSummary"></div>
    <div id="aiReading">
      <div id="aiReadingHeader">
        <div class="readingOrb"></div>
        <span class="readingLabel">正在解读中</span>
        <div class="readingDots"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div id="aiContent"></div>
      <div id="aiProgressBar" style="display:none"><div id="aiProgressFill"></div></div>
      <button id="aiRetryBtn">重新解读</button>
    </div>
    <div id="readingActions">
      <button id="copyReadingBtn" class="uiBtn">复制本次解读</button>
      <button id="settleClose" class="uiBtn">✦ 开始新的解读</button>
    </div>
    <p id="readingDisclaimer">解读仅供娱乐与自我反思，请结合现实信息独立判断。</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════════
// TAROT DECK DATA
// ═══════════════════════════════════════════════════════════════
const MAJOR=[
  {id:0,name:"The Fool 愚者",up:"新的开始、自由、冒险精神、无限可能",rev:"鲁莽、不计后果、迷失方向"},

  {id:2,name:"The High Priestess 女祭司",up:"直觉、潜意识、内在智慧、神秘",rev:"隐藏的动机、表面化、忽视直觉"},
  {id:3,name:"The Empress 女皇",up:"丰饶、母性、自然、感官愉悦",rev:"依赖、空虚、创造力受阻"},

  {id:8,name:"Strength 力量",up:"内在力量、勇气、耐心、慈悲",rev:"自我怀疑、软弱、缺乏自信"},
  {id:9,name:"The Hermit 隐者",up:"内省、独处、寻找真理、智慧",rev:"孤立、逃避、固执己见"},
  {id:10,name:"Wheel of Fortune 命运之轮",up:"命运转折、好运、周期、关键时刻",rev:"坏运气、抗拒变化、失控"},
  {id:11,name:"Justice 正义",up:"公正、真理、因果、法律",rev:"不公正、不诚实、逃避责任"},
  {id:12,name:"The Hanged Man 倒吊人",up:"牺牲、新视角、等待、放下",rev:"拖延、抗拒牺牲、自私"},
  {id:13,name:"Death 死神",up:"结束、转变、过渡、放下过去",rev:"抗拒改变、停滞、恐惧"},
  {id:14,name:"Temperance 节制",up:"平衡、耐心、适度、和谐",rev:"失衡、过度、缺乏耐心"},
  {id:15,name:"The Devil 恶魔",up:"束缚、诱惑、物质主义、阴暗面",rev:"释放、打破束缚、重获自由"},
  {id:16,name:"The Tower 塔",up:"突变、崩塌、启示、解放",rev:"逃避灾难、恐惧改变、延迟"},
  {id:17,name:"The Star 星星",up:"希望、灵感、宁静、信念",rev:"绝望、失去信心、断开连接"},
  {id:18,name:"The Moon 月亮",up:"幻觉、直觉、潜意识、不确定",rev:"释放恐惧、真相浮出、清晰"},

// Use image proxy for CORS support (sacred-texts.com blocks cross-origin)
const RWS_RAW='https://www.sacred-texts.com/tarot/pkt/img/';
const RWS_PROXIES=[
  (f)=>'https://wsrv.nl/?url='+encodeURIComponent(RWS_RAW+f),
  (f)=>'https://images.weserv.nl/?url='+encodeURIComponent(RWS_RAW+f),
  (f)=>'https://corsproxy.io/?url='+encodeURIComponent(RWS_RAW+f),
];
function rwsFilename(card){
  if(card.type==='major') return 'ar'+String(card.id).padStart(2,'0')+'.jpg';
  const sm={Wands:'wa',Cups:'cu',Swords:'sw',Pentacles:'pe'};
  const rn=['ac','02','03','04','05','06','07','08','09','10','pa','kn','qu','ki'];
  return sm[card.suit]+rn[card.rank]+'.jpg';
}
// Load image with retry across multiple proxies
function loadCardImage(card){
  const fname=rwsFilename(card);
  return new Promise(resolve=>{
    let attempt=0;
    function tryNext(){
      if(attempt>=RWS_PROXIES.length){resolve(null);return;}
      const url=RWS_PROXIES[attempt](fname);
      attempt++;
      const img=new Image();img.crossOrigin='anonymous';
      const timer=setTimeout(()=>{img.src='';console.warn('Timeout proxy',attempt-1,url);tryNext();},8000);
      img.onload=()=>{clearTimeout(timer);console.log('Loaded:',card.name,'via proxy',attempt-1);resolve(img);};
      img.onerror=()=>{clearTimeout(timer);console.warn('Error proxy',attempt-1,url);tryNext();};
      img.src=url;
    }
    tryNext();
  });
}

function wrapText(ctx,text,x,y,maxW,lineH){

}

function createRoundedCardGeo(){
  const hw=CARD_W/2, hh=CARD_H/2, r=CARD_R;
  const shape=new THREE.Shape();
  shape.moveTo(-hw+r,-hh);
  shape.lineTo(hw-r,-hh);
  shape.quadraticCurveTo(hw,-hh,hw,-hh+r);
  shape.lineTo(hw,hh-r);
  shape.quadraticCurveTo(hw,hh,hw-r,hh);
  shape.lineTo(-hw+r,hh);
  shape.quadraticCurveTo(-hw,hh,-hw,hh-r);
  shape.lineTo(-hw,-hh+r);
  shape.quadraticCurveTo(-hw,-hh,-hw+r,-hh);

  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:CARD_D, bevelEnabled:false
  });
  geo.translate(0,0,-CARD_D/2); // center on Z like BoxGeometry

  // Normalize UVs for texture mapping on cap faces
  const pos=geo.attributes.position, uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){
    const u=(pos.getX(i)+hw)/CARD_W, v=(pos.getY(i)+hh)/CARD_H;
    // Flip U on front cap — viewed after rotation.y=PI which mirrors X
    if(pos.getZ(i)<-CARD_D*0.25) uv.setXY(i,1-u,v);
    else uv.setXY(i,u,v);
  }
  uv.needsUpdate=true;

  // Split groups: front cap (z<0) → mat 0, back cap (z≥0) → mat 1, sides → mat 2
  const capGrp=geo.groups.find(g=>g.materialIndex===0);
  const sideGrp=geo.groups.find(g=>g.materialIndex===1);
  if(capGrp&&sideGrp&&geo.index){
    const idx=geo.index;
    let splitAt=-1;
    for(let i=capGrp.start;i<capGrp.start+capGrp.count;i+=3){
      if(pos.getZ(idx.getX(i))>-CARD_D*0.25){splitAt=i;break;}
    }
    if(splitAt===-1)splitAt=capGrp.start+capGrp.count;
    geo.clearGroups();
    geo.addGroup(capGrp.start,splitAt-capGrp.start,0);               // front cap (card face)
    geo.addGroup(splitAt,capGrp.start+capGrp.count-splitAt,1);       // back cap (card back)
    geo.addGroup(sideGrp.start,sideGrp.count,2);                     // sides (edge)
  }
  return geo;
}

      }
      vec3 hsv2rgb(vec3 c){
        vec3 p=abs(fract(c.xxx+vec3(1.0,2.0/3.0,1.0/3.0))*6.0-3.0);
        return c.z*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),c.y);
      }
      void main(){
        vec2 c=(vUv-0.5)*uPlane; // world-space coords
        float dist=rrSDF(c,uCard,uR);
        // tight neon tube right at card edge
        float tube=smoothstep(0.03,0.005,dist)*smoothstep(-0.025,-0.005,dist);
        // outer bloom glow
        float bloom=smoothstep(0.1,0.0,dist)*smoothstep(-0.08,0.0,dist)*0.4;
        float border=tube+bloom;
        // === MARQUEE CHASING LIGHTS ===
        // perimeter angle for traveling effect
        float angle=atan(c.y,c.x);
        float perim=angle/6.2832+0.5; // 0-1 around perimeter
        // multiple chasing light waves at different speeds
        float chase1=sin(perim*40.0-uTime*8.0)*0.5+0.5;
        float chase2=sin(-perim*30.0-uTime*6.0)*0.5+0.5;
        float chase3=sin(perim*20.0+uTime*10.0)*0.5+0.5;
        float marquee=max(chase1,max(chase2,chase3));
        // sparkle flicker
        float flicker=sin(perim*80.0+uTime*15.0)*0.3+0.7;
        marquee*=flicker;
        border*=0.4+0.6*marquee;
        // === VIBRANT RAINBOW COLOR ===
        // hue cycles around perimeter + shifts with time (hot magenta dominant)
        float hue=fract(perim*2.0-uTime*0.8+0.85); // offset so magenta is prominent
        vec3 col=hsv2rgb(vec3(hue,0.85,1.0));
        // boost hot magenta/pink tones
        col=mix(col,vec3(1.0,0.0,0.5),0.15);
        // bright white core on tube
        col=mix(col,vec3(1.0),tube*0.5);
        float a=border*uOpacity;
        if(a<0.003)discard;
        gl_FragColor=vec4(col,a);
      }
    `
  });
}

function spawnPile(){
  clearPile();
  if(deck.length===0){showHint('牌库已空');return;}
  gameState='pile';
  selectedIndex=-1;
  pileOffset=0;pileOffsetTarget=0;
  hideCardInfo();
  const count=Math.min(PILE_COUNT,deck.length);
  pileCardData=[];
  const shuffled=[...deck];
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  for(let i=0;i<count;i++) pileCardData.push(shuffled[i]);

  for(let i=0;i<count;i++){
    const geo=_cardGeoTpl.clone();
    // slight per-card variation for realism
    const wear=0.92+Math.random()*0.08;
    const edgeCol=new THREE.Color(0x1a2848).multiplyScalar(wear);
    const backMat=new THREE.MeshStandardMaterial({map:backTex,roughness:0.5+Math.random()*0.15,emissive:0x081828,emissiveIntensity:0.4+Math.random()*0.1});
    const edgeMat=new THREE.MeshStandardMaterial({color:edgeCol,roughness:0.55+Math.random()*0.15,emissive:0x041820,emissiveIntensity:0.35});
    // [front cap, back cap, sides]
    const mats=[backMat, backMat, edgeMat];
    const mesh=new THREE.Mesh(geo,mats);
    // fan angle: centered, evenly spaced
    const mid=(count-1)/2;
    const angleDeg=(i-mid)*FAN_ARC_DEG;
    const angleRad=angleDeg*Math.PI/180;
    // position on arc
    const x=Math.sin(angleRad)*FAN_RADIUS;
    const y=FAN_PIVOT_Y+Math.cos(angleRad)*FAN_RADIUS;
    // realistic imperfections: slight jitter
    const jitterZ=(Math.random()-0.5)*0.003; // tiny rotation jitter
    const jitterY=(Math.random()-0.5)*0.01;  // tiny Y offset
    mesh.position.set(x,y+jitterY,i*0.004);
    mesh.rotation.set(-0.08,0,-angleRad+jitterZ);
    // create glow ring behind card
    const ring=new THREE.Mesh(glowRingGeo,makeGlowMat());
    ring.visible=false;
    ring.position.copy(mesh.position);ring.position.z-=0.02;
    ring.rotation.copy(mesh.rotation);
    scene.add(ring);
    mesh.userData={
      pileIndex:i, angleDeg, angleRad,
      basePos:mesh.position.clone(), baseRot:mesh.rotation.clone(),
      hovered:false, hoverT:0, glowPhase:Math.random()*Math.PI*2,
      glowRing:ring
    };
    scene.add(mesh);
    pileMeshes.push(mesh);
  }
  document.getElementById('deckCount').textContent=`剩余: ${deck.length}`;
  showHint('选择一张牌');
}

function clearPile(){
  pileMeshes.forEach(m=>{
    if(m.userData.glowRing){scene.remove(m.userData.glowRing);m.userData.glowRing.material.dispose();}
    scene.remove(m);m.geometry.dispose();
  });
  pileMeshes=[];
  if(revealedMesh){scene.remove(revealedMesh);revealedMesh.geometry.dispose();revealedMesh=null;}
  // NOTE: retiredMeshes are NOT cleared — they persist in the corner
}

let flipStarted=false; // guard against re-entry

  // clean up pile meshes + glow rings
  const selectedMesh=animMesh;

// Retired cards — centered at top, larger display
const CORNER_SCALE=0.55;
const CORNER_Y=3.2, CORNER_Z=1.0;
const CORNER_SPACING=CARD_W*CORNER_SCALE+0.08;
let retiredMeshes=[]; // all drawn cards kept at the top

function reposRetiredCards(){
  // re-center all retired cards horizontally at the top, uniform alignment
  const n=retiredMeshes.length;
  const totalW=(n-1)*CORNER_SPACING;
  const startX=-totalW/2;
  retiredMeshes.forEach((m,i)=>{
    m.position.set(startX+i*CORNER_SPACING, CORNER_Y, CORNER_Z);
    m.rotation.set(0, Math.PI, 0); // all upright, face showing
    m.scale.setScalar(CORNER_SCALE);
  });
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION UPDATE
// ═══════════════════════════════════════════════════════════════
function updateAnimations(dt){
  // Fade out non-selected pile cards
  pileMeshes.forEach(m=>{
    if(m.userData.fading){
      // hide glow ring immediately
      if(m.userData.glowRing) m.userData.glowRing.visible=false;
      m.material.forEach(mat=>{
        if(!mat.transparent){mat.transparent=true;mat.needsUpdate=true;}
        mat.opacity=Math.max(0,mat.opacity-dt*2.5);
      });
      if(m.material[0].opacity<=0){
        if(m.userData.glowRing){scene.remove(m.userData.glowRing);m.userData.glowRing.material.dispose();}
        scene.remove(m);m.geometry.dispose();
        m.userData.fading=false;
      }
    }
  });

  // Pile follow mouse + hover animation
  if(gameState==='pile'){
    pileOffset+=(pileOffsetTarget-pileOffset)*dt*4;
    const scrollAngle=pileOffset*3*Math.PI/180;
    const now=performance.now()*0.001;
    pileMeshes.forEach((m,idx)=>{
      if(!m.userData.fading){
        const target=m.userData.hovered?1:0;
        m.userData.hoverT+=(target-m.userData.hoverT)*dt*8;
        const h=m.userData.hoverT;
        const baseAngle=m.userData.angleRad+scrollAngle;
        const x=Math.sin(baseAngle)*FAN_RADIUS;
        const y=FAN_PIVOT_Y+Math.cos(baseAngle)*FAN_RADIUS;
        m.position.x=x;
        m.position.y=y+h*0.4;
        m.position.z=m.userData.basePos.z+h*0.5;
        m.rotation.x=m.userData.baseRot.x+h*(-0.1);
        m.rotation.y=0;
        m.rotation.z=-baseAngle+h*(baseAngle*0.6);
        // card emissive: subtle cyan neon tint on hover
        m.material.forEach(mt=>{
          if(mt.emissive){
            mt.emissive.setRGB(0.02+h*0.03,0.06+h*0.12,0.1+h*0.14);
            mt.emissiveIntensity=0.3+h*0.5;
          }
        });
        // neon glow ring
        const ring=m.userData.glowRing;
        if(ring){
          ring.visible=h>0.01;
          if(ring.visible){
            ring.position.copy(m.position);
            ring.position.z-=0.015;
            ring.rotation.copy(m.rotation);
            const pulse=0.8+0.2*Math.sin(now*5+m.userData.glowPhase);
            ring.material.uniforms.uOpacity.value=h*pulse;
            ring.material.uniforms.uTime.value=now;
          }
        }
      }
    });
  }

  // Rising animation
  if(gameState==='rising'&&animMesh){
    animProgress=Math.min(animProgress+dt*1.2,1);
    const e=easeInOutCubic(animProgress);
    animMesh.position.lerpVectors(animStartPos,RISE_POS,e);
    animMesh.rotation.x=animStartRot.x*(1-e)+0*e;
    animMesh.rotation.z=animStartRot.z*(1-e)+0*e;
    // glow ring follows card and fades out
    const ring=animMesh.userData.glowRing;
    if(ring){
      ring.position.copy(animMesh.position);ring.position.z-=0.015;
      ring.rotation.copy(animMesh.rotation);
      ring.material.uniforms.uOpacity.value=1-e;
      ring.material.uniforms.uTime.value=performance.now()*0.001;
      if(e>=1) ring.visible=false;
    }
    if(animProgress>=1) startFlip();
  }

  // Flipping animation
  if(gameState==='flipping'&&revealedMesh){
    animProgress=Math.min(animProgress+dt*0.9,1);
    const e=easeInOutCubic(animProgress);
    revealedMesh.position.lerpVectors(RISE_POS,REVEAL_POS,e);
    revealedMesh.rotation.x=-0.18*e; // tilt back to face camera
    revealedMesh.rotation.y=Math.PI*e;
    revealedMesh.rotation.z=revealedReversed?Math.PI*e:0;
    revealLight.intensity=e*3.0; // gradually illuminate face
    if(animProgress>=1) finishReveal();
  }

  // Revealed: gentle float
  if(gameState==='revealed'&&revealedMesh){
    revealedMesh.position.y=REVEAL_POS.y+Math.sin(performance.now()*0.001)*0.03;
    revealedMesh.rotation.x=-0.18; // stay tilted to face camera
  }

  // Retiring: fly card to top center, shrink
  if(gameState==='retiring'&&revealedMesh){
    animProgress=Math.min(animProgress+dt*1.8,1);
    const e=easeInOutCubic(animProgress);
    const target=revealedMesh.userData.cornerTarget||new THREE.Vector3(0,CORNER_Y,CORNER_Z);
    revealedMesh.position.lerpVectors(animStartPos,target,e);
    const s=1-e*(1-CORNER_SCALE);
    revealedMesh.scale.setScalar(s);
    // rotate to face camera
    revealedMesh.rotation.y=Math.PI*(1-e)+e*Math.PI; // keep face showing
    revealedMesh.rotation.x=0;
    revealedMesh.rotation.z=revealedReversed?Math.PI*(1-e):0; // smoothly upright
    if(animProgress>=1){
      // park card permanently
      revealedMesh.scale.setScalar(CORNER_SCALE);
      revealedMesh.position.copy(target);
      revealedMesh.rotation.set(0,Math.PI,0); // uniform upright alignment
      retiredMeshes.push(revealedMesh);
      reposRetiredCards(); // re-center all retired cards at top
      revealedMesh=null;
      hideCardInfo();
      updateDrawUI();
      if(sessionDraws.length>=MAX_DRAWS){
        // max draws reached — auto settle
        gameState='idle';
        setTimeout(()=>showSettlement(),500);
      } else {
        gameState='spawning';
        setTimeout(()=>spawnPile(),300);
      }
    }
  }
}

function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

// ═══════════════════════════════════════════════════════════════
// PARTICLE DISSOLUTION — soft blue/purple
// ═══════════════════════════════════════════════════════════════
let particles=null;
let particleLife=0;
const P_COUNT=reduceMotion?500:(isMobile?1400:2500);
const P_DUR=2.8;

function startDissolution(){
  if(!revealedMesh)return;
  gameState='dissolving';
  revealLight.intensity=0; // turn off reveal light
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(P_COUNT*3);
  const vel=new Float32Array(P_COUNT*3);
  const sizes=new Float32Array(P_COUNT);
  const cp=revealedMesh.position;
  for(let i=0;i<P_COUNT;i++){
    pos[i*3]=cp.x+(Math.random()-0.5)*CARD_W;
    pos[i*3+1]=cp.y+(Math.random()-0.5)*CARD_H;
    pos[i*3+2]=cp.z+(Math.random()-0.5)*0.1;
    vel[i*3]=(Math.random()-0.5)*0.25;
    vel[i*3+1]=Math.random()*0.4+0.15;
    vel[i*3+2]=(Math.random()-0.5)*0.2;
    sizes[i]=Math.random()*3+0.8;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aVel',new THREE.BufferAttribute(vel,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0}},
    vertexShader:`
      attribute vec3 aVel;attribute float aSize;
      uniform float uTime;varying float vAlpha;varying float vT;
      void main(){
        float t=uTime;vT=t;
        vec3 p=position+aVel*t;
        p.x+=sin(t*2.5+position.y*4.0)*0.08*t;
        p.z+=cos(t*2.0+position.x*3.0)*0.06*t;
        vAlpha=1.0-t/${P_DUR.toFixed(1)};
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=aSize*(250.0/(-mv.z))*max(0.0,1.0-t*0.3);
        gl_Position=projectionMatrix*mv;
      }
    `,
    fragmentShader:`
      varying float vAlpha;varying float vT;
      void main(){
        float d=length(gl_PointCoord-0.5)*2.0;
        if(d>1.0)discard;
        float a=smoothstep(1.0,0.2,d)*vAlpha*0.7;
        vec3 col=mix(vec3(0.5,0.6,1.0),vec3(0.3,0.3,0.8),vT/${P_DUR.toFixed(1)});
        gl_FragColor=vec4(col,a);
      }
    `
  });
  particles=new THREE.Points(geo,mat);
  scene.add(particles);
  scene.remove(revealedMesh);revealedMesh.geometry.dispose();revealedMesh=null;
  particleLife=0;
  setTimeout(()=>hideCardInfo(),1800);
}

function updateParticles(dt){
  if(!particles)return;
  particleLife+=dt;
  particles.material.uniforms.uTime.value=particleLife;
  if(particleLife>=P_DUR){
    scene.remove(particles);particles.geometry.dispose();particles.material.dispose();
    particles=null;
    gameState='spawning';
    setTimeout(()=>spawnPile(),500);
  }
}

// ═══════════════════════════════════════════════════════════════
let isAIStreaming=false;

function parseMD(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^# (.+)$/gm,'<h3>$1</h3>')
    .replace(/^- (.+)$/gm,'<div style="padding-left:16px;color:#9aadcc">• $1</div>')
    .replace(/^\d+\. (.+)$/gm,'<div style="padding-left:16px;color:#9aadcc">$&</div>')
    .replace(/\n{2,}/g,'</p><p style="margin-top:12px">')
    .replace(/\n/g,'<br>');
}

async function requestAIReading(){
  if(isAIStreaming) return;
  isAIStreaming=true;
  const contentDiv=document.getElementById('aiContent');
  const progressBar=document.getElementById('aiProgressBar');
  const progressFill=document.getElementById('aiProgressFill');
  const retryBtn=document.getElementById('aiRetryBtn');
  contentDiv.innerHTML='';
  progressBar.style.display='block';
  progressFill.style.width='0%';
  retryBtn.style.display='none';
  // activate reading animation
  document.getElementById('aiReading').classList.add('active');
  document.getElementById('aiReadingHeader').classList.add('show');
  // thinking animation
  const thinkEl=document.createElement('div');
  thinkEl.className='aiThinking';
  thinkEl.innerHTML='<div class="dots"><span></span><span></span><span></span></div><span>正在连接星象，解读牌面...</span>';
  contentDiv.appendChild(thinkEl);

  const cardsDesc=sessionDraws.map((d,i)=>{
    const c=d.card,r=d.reversed;
    const meaning=r?c.rev:c.up;
    const pos=POSITION_LABELS[i]||`第${i+1}张`;
    return `【${pos}】${c.name} - ${r?'逆位':'正位'}\n含义：${meaning}`;
  }).join('\n\n');

  try{
    const resp=await fetch('/.netlify/functions/tarot-reading',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:userQuestion,cards:cardsDesc})
    });
    if(!resp.ok){const e=await resp.text();throw new Error(`API错误(${resp.status}): ${e}`);}
    thinkEl.remove();
    const textDiv=document.createElement('div');
    textDiv.style.cssText='margin-top:4px;';
    contentDiv.appendChild(textDiv);
    const cursor=document.createElement('span');
    cursor.id='aiCursor';
    textDiv.appendChild(cursor);

    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='',fullText='';
    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';
      for(const line of lines){
        if(line.startsWith('data: ')){
          const data=line.slice(6);
          if(data==='[DONE]')continue;
          try{
            const json=JSON.parse(data);
            if(json.error)throw new Error(json.error.message||JSON.stringify(json.error));
            const c=json.choices?.[0]?.delta?.content;
            if(c){
              fullText+=c;
              textDiv.innerHTML='<p>'+parseMD(fullText)+'</p>';
              textDiv.appendChild(cursor);
              contentDiv.scrollTop=contentDiv.scrollHeight;
              progressFill.style.width=Math.min(95,fullText.length/8)+'%';
            }
          }catch(e){if(e.message&&!e.message.includes('JSON'))throw e;}
        }
      }
    }
    if(!fullText){textDiv.innerHTML='<p style="color:#6a80a8;text-align:center">解读未能返回内容，请检查网络或 API Key 后重试。</p>';}
    progressFill.style.width='100%';
  }catch(err){
    console.error('AI reading error:',err);
    contentDiv.innerHTML=`
      <div style="text-align:center;padding:30px 0;">
        <p style="color:#d06050;font-size:15px;margin-bottom:10px;">解读连接出现了问题</p>
        <p style="color:#5a6a8a;font-size:12px;">${err.message}</p>
      </div>`;
  }finally{
    isAIStreaming=false;
    retryBtn.style.display='inline-block';
    progressBar.style.display='none';
    // stop reading animation
    document.getElementById('aiReading').classList.remove('active');
    document.getElementById('aiReadingHeader').classList.remove('show');
    const c=document.getElementById('aiCursor');if(c)c.remove();
  }
}

let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTick(pitch=800,vol=0.12){
  ensureAudio();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(pitch,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(pitch*0.6,audioCtx.currentTime+0.06);
  gain.gain.setValueAtTime(vol,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+0.1);
}
function playConfirm(){
  ensureAudio();
  [0,80,160].forEach((delay,i)=>{
    setTimeout(()=>playTick(600+i*200,0.15),delay);
  });
}
function playWhoosh(pitch=400,dur=0.25,vol=0.1){
  ensureAudio();const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  filter.type='bandpass';filter.frequency.setValueAtTime(pitch,t);filter.Q.value=0.5;
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(pitch,t);osc.frequency.exponentialRampToValueAtTime(pitch*2.5,t+dur*0.6);
  osc.frequency.exponentialRampToValueAtTime(pitch*0.3,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(vol*1.5,t+dur*0.3);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(filter);filter.connect(g);g.connect(audioCtx.destination);
  osc.start(t);osc.stop(t+dur);
}
function playShimmer(vol=0.08){
  ensureAudio();const t=audioCtx.currentTime;
  const freqs=[1200,1500,1800,2200];
  freqs.forEach((f,i)=>{
    const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(f,t+i*0.08);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+i*0.08+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.4);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start(t+i*0.08);osc.stop(t+i*0.08+0.5);
  });
}
function playRevealChime(){
  ensureAudio();const t=audioCtx.currentTime;
  const notes=[523,659,784,1047]; // C5 E5 G5 C6 major chord arpeggio
  notes.forEach((f,i)=>{
    const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
    osc.type='triangle';osc.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+i*0.12+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.6);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start(t+i*0.12);osc.stop(t+i*0.12+0.7);
  });
}
function playRetire(){
  ensureAudio();const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(800,t);osc.frequency.exponentialRampToValueAtTime(300,t+0.3);
  g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+0.35);
}

function classifyGesture(lms){
  if(!lms||!lms.length)return'NONE';
  const lm=lms[0];
  const dist=(a,b)=>Math.sqrt((lm[a].x-lm[b].x)**2+(lm[a].y-lm[b].y)**2+(lm[a].z-lm[b].z)**2);
  const tips=[4,8,12,16,20],pips=[3,6,10,14,18];
  const ext=tips.map((t,i)=>i===0?dist(4,9)>dist(3,9):lm[t].y<lm[pips[i]].y);
  const cnt=ext.filter(Boolean).length;
  if(dist(4,8)<0.07)return'PINCH';
  if(cnt<=1&&!ext[1]&&!ext[2]&&!ext[3]&&!ext[4])return'FIST';
  if(ext[1]&&!ext[2]&&!ext[3]&&!ext[4])return'POINT';
  if(cnt>=4)return'OPEN';
  return'NONE';
}
let lastGesture='NONE',gestureStable=0;
const vCursor=document.getElementById('vCursor');
const vCursorLabel=document.getElementById('vCursorLabel');
let vCursorHovIdx=-1;
let gestureSelectCooldown=0;
let vCursorX=0,vCursorY=0; // smoothed cursor position

function processGesture(){
  if(inputMode!=='gesture'||!handResults)return;
  const lms=handResults.multiHandLandmarks;
  const g=classifyGesture(lms);
  document.getElementById('gestureInfo').textContent=`手势: ${g} · 模式: 手势`;

  if(gestureSelectCooldown>0) gestureSelectCooldown--;

  if(!lms||!lms.length){
    vCursor.style.display='none';
    // clear hover when hand disappears
    pileMeshes.forEach(m=>{ m.userData.hovered=false; });
    return;
  }

  // Palm center from landmark 9 (middle finger base)
  const palm=lms[0][9];
  // MediaPipe x is mirrored (0=right, 1=left), flip it
  const targetX=(1-palm.x)*window.innerWidth;
  const targetY=palm.y*window.innerHeight;

  // Smooth interpolation (lerp) — fast tracking with slight smoothing
  const lerp=0.35;
  if(vCursor.style.display==='none'){vCursorX=targetX;vCursorY=targetY;} // snap on first show
  vCursorX+=(targetX-vCursorX)*lerp;
  vCursorY+=(targetY-vCursorY)*lerp;

  // Show and position virtual cursor
  vCursor.style.display='block';
  vCursor.style.left=vCursorX+'px';
  vCursor.style.top=vCursorY+'px';
  const screenX=vCursorX,screenY=vCursorY;

  // Update cursor visual state
  vCursor.className='';
  if(g==='PINCH') vCursor.className='grab';

  // Convert to normalized device coords for raycasting
  mouse.x=(screenX/window.innerWidth)*2-1;
  mouse.y=-(screenY/window.innerHeight)*2+1;

  // Drive pile scroll
  if(gameState==='pile'){
    pileOffsetTarget=mouse.x*-1.8;

    // Raycast for hover
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(pileMeshes);
    pileMeshes.forEach(m=>{ m.userData.hovered=false; });
    vCursorHovIdx=-1;

    if(hits.length>0){
      const hm=hits[0].object;
      hm.userData.hovered=true;
      vCursorHovIdx=hm.userData.pileIndex;
      if(!vCursor.classList.contains('grab')) vCursor.className='hover';
      vCursorLabel.textContent='🤏 捏合选牌';
      // tick sound
      if(vCursorHovIdx!==lastHoveredIndex){
        playTick(650+vCursorHovIdx*40,0.08);
        lastHoveredIndex=vCursorHovIdx;
      }
    } else {
      vCursorLabel.textContent='';
      lastHoveredIndex=-1;
    }
  } else if(gameState==='revealed'){
    vCursorLabel.textContent='🤏 捏合确认';
  } else {
    vCursorLabel.textContent='';
  }

  // Gesture actions with stability + cooldown
  if(g===lastGesture) gestureStable++; else gestureStable=0;
  lastGesture=g;
  if(gestureStable<4||gestureSelectCooldown>0) return;

  if(gameState==='pile'&&g==='PINCH'){
    if(vCursorHovIdx>=0){
      selectCard(vCursorHovIdx);
      gestureSelectCooldown=30;
      vCursor.className='grab';
    }
  }
  if(gameState==='revealed'&&g==='PINCH'){
    confirmDraw();
    gestureSelectCooldown=30;
  }
}

// ═══════════════════════════════════════════════════════════════
// RESIZE & MAIN LOOP
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.getElapsedTime();
  // Subtle camera drift for spatial depth
  camera.position.x=reduceMotion?0:Math.sin(t*0.08)*0.15;
  camera.position.y=reduceMotion?3.2:3.2+Math.sin(t*0.06)*0.08;
  camera.lookAt(0,1.4,0);
  // glow ring uTime is set in updateAnimations
  processGesture();
  updateHover();
  updateAnimations(dt);
  updateParticles(dt);
  renderer.render(scene,camera);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
// Show question overlay on load; spawn pile after user confirms
document.getElementById('questionOverlay').style.display='flex';
updateInstructions();
animate();
</script>
